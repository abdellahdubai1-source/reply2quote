name: Bootstrap Reply2Quote source

on:
  push:
    branches: [main]
    paths:
      - 'reply2quote-fixed.zip'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract production source
        run: |
          unzip -o reply2quote-fixed.zip
          rm -f reply2quote-fixed.zip
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import Reply2Quote production source"
            git push origin main
          fi
