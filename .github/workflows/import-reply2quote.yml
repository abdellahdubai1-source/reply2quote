name: Import Reply2Quote source

on:
  push:
    branches: [main]
    paths:
      - 'reply2quote-fixed.zip'
      - '.github/workflows/import-reply2quote.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate archive
        run: unzip -t reply2quote-fixed.zip

      - name: Extract source
        run: |
          unzip -o reply2quote-fixed.zip
          rm -f reply2quote-fixed.zip
          # The Actions token can push normal source files, but it cannot create a new workflow file.
          # CI will be added separately after this import succeeds.
          rm -f .github/workflows/ci.yml
          rm -f .github/workflows/import-reply2quote.yml

      - name: Commit production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Reply2Quote production source"
          git push origin main
